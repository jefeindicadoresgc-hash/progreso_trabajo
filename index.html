<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Servicio - Taller Hyundai</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginOverlay" class="login-screen">
        <div class="login-box">
            <div class="login-header">
                <div class="camera-lens"></div>
                <div class="status-lights">
                    <span class="light red"></span><span class="light yellow"></span><span class="light green"></span>
                </div>
            </div>
            <div class="login-body">
                <h2>IDENTIFICACIÓN</h2>
                <select id="loginUser" class="assign-select">
                    <option value="jefe">Jefe de Taller</option>
                    <option value="daniel">Daniel</option>
                    <option value="jorge">Jorge</option>
                    <option value="luis">Luis</option>
                </select>
                <input type="password" id="loginPin" class="assign-input" placeholder="INGRESA TU PIN" style="margin-top: 15px; text-align:center; letter-spacing: 5px;">
                <button id="btnEntrar" class="btn-action" style="width: 100%; margin-top: 20px;">ACCEDER AL TALLER</button>
            </div>
        </div>
    </div>

    <!-- CABECERA DEL DASHBOARD -->
    <header class="main-header">
        <div class="logo-area">
            <h1>CENTRO DE SERVICIO</h1>
            <p>HYUNDAI COATZA</p>
        </div>
        
        <div class="header-controls">
            <!-- Controles Exclusivos Admin 2099 -->
            <div id="adminControlsTaller" class="admin-panel" style="display:none;">
                <button id="btnAddAdicional" class="btn-action btn-blue">+ ADICIONAL</button>
                <button id="btnDelAdicional" class="btn-action btn-orange">- QUITAR ADICIONAL</button>
            </div>
            
            <span id="displayUser" class="user-badge"></span>
            <button id="btnSalir" class="btn-action btn-red">SALIR</button>
        </div>
    </header>

    <!-- ZONAS DE TRABAJO -->
    <div class="dashboard">
        <!-- ZONA 1: PIT STOP -->
        <section id="zonaJefe" class="zone-box" style="display:none;">
            <h2 class="section-title text-red">📥 RECEPCIÓN - AUTOS EN ESPERA</h2>
            <div id="grid-espera" class="car-grid"></div>
        </section>

        <!-- ZONA 2: BAHÍAS -->
        <section id="zonaBahias" class="zone-box" style="display:none;">
            <h2 class="section-title text-blue">⚙️ TRABAJANDO</h2>
            <div id="grid-bahias" class="car-grid"></div>
        </section>

        <!-- ZONA 3: TRABAJOS REALIZADOS (KPI) -->
        <section id="zonaTerminados" class="zone-box kpi-box" style="display:none;">
            <div class="kpi-header">
                <h2 class="section-title text-green" style="margin:0;">🏆 KPI</h2>
                <input type="text" id="kpiSearch" placeholder="🔍 Buscar técnico, placa, folio..." class="search-input">
            </div>
            
            <div class="table-responsive">
                <table class="kpi-table">
                    <thead>
                        <tr>
                            <th>Folio</th><th>Placas</th><th>Vehículo</th>
                            <th>Categoría Taller</th><th>Adicionales</th>
                            <th>Técnico</th><th>Tiempos</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-terminados"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
